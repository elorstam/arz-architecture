ır. Ölçümün ürettiği tanımlayıcılar ve ayarlar mevcut yapılandırmaya bağlıdır; yayımdan önce çerez taramasıyla doğrulanmalıdır.\"},\"title\":\"Analitik çerezler\"},\"4\":{\"paragraphs\":{\"1\":\"Dil veya görünüm tercihini hatırlayan kayıtlar yalnız ilgili özellik kullanıldığında oluşabilir.\"},\"title\":\"Tercih çerezleri\"},\"5\":{\"paragraphs\":{\"1\":\"Mevcut uygulamada doğrulanmış bir pazarlama çerezi listelenmemektedir. Yeni araç eklenirse politika ve gerekli tercih mekanizması güncellenir.\"},\"title\":\"Pazarlama çerezleri\"},\"6\":{\"paragraphs\":{\"1\":\"Barındırma, analitik, veri altyapısı ve e-posta sağlayıcıları sınırlı teknik verilere erişebilir.\"},\"title\":\"Üçüncü taraf hizmet sağlayıcıları\"},\"7\":{\"paragraphs\":{\"1\":\"Çerez süreleri, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Çerez süreleri\"},\"8\":{\"paragraphs\":{\"1\":\"Tarayıcı ayarları, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Tarayıcı ayarları\"},\"9\":{\"paragraphs\":{\"1\":\"Çerez tercihleri, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Çerez tercihleri\"},\"10\":{\"paragraphs\":{\"1\":\"Güvenlik tedbirleri, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Güvenlik tedbirleri\"},\"11\":{\"paragraphs\":{\"1\":\"Politika değişiklikleri, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Politika değişiklikleri\"},\"12\":{\"paragraphs\":{\"1\":\"İletişim, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"İletişim\"}},\"shortTitle\":\"Gizlilik ve Çerez\",\"title\":\"Gizlilik ve Çerez Politikası\"},\"hizmet-teslim-ve-ifa-kosullari\":{\"description\":\"Mimarlık hizmetlerinin proje aşamaları, süreleri ve teslim kanalları.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Hizmet; toplantı, saha çalışması, danışmanlık, dijital dosya veya kararlaştırılmış basılı çıktı yoluyla ifa edilebilir.\"},\"title\":\"Hizmetin dijital ve/veya fiziksel ifası\"},\"2\":{\"paragraphs\":{\"1\":\"Aşamalar, kilometre taşları ve kabul ölçütleri teklifte belirtilir.\"},\"title\":\"Proje aşamaları\"},\"3\":{\"paragraphs\":{\"1\":\"Teslim; kapsamına göre PDF, DWG, görsel, rapor veya basılı doküman içerebilir. Kaynak dosya teslimi ayrıca kararlaştırılır.\"},\"title\":\"Teslim biçimleri\"},\"4\":{\"paragraphs\":{\"1\":\"Yetkilendirilen dosyalar güvenli Client Portal alanında müşteriye sunulabilir.\"},\"title\":\"Client Portal üzerinden teslim\"},\"5\":{\"paragraphs\":{\"1\":\"Dosya boyutu ve gizlilik düzeyine göre e-posta ya da süreli/güvenli indirme bağlantısı kullanılabilir.\"},\"title\":\"E-posta veya güvenli indirme\"},\"6\":{\"paragraphs\":{\"1\":\"Tahmini süreler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Tahmini süreler\"},\"7\":{\"paragraphs\":{\"1\":\"Müşteriden kaynaklanan gecikmeler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Müşteriden kaynaklanan gecikmeler\"},\"8\":{\"paragraphs\":{\"1\":\"Resmî kurum/belediye süreçlerinden kaynaklanan süreler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Resmî kurum/belediye süreçlerinden kaynaklanan süreler\"},\"9\":{\"paragraphs\":{\"1\":\"Revizyon süreleri, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Revizyon süreleri\"},\"10\":{\"paragraphs\":{\"1\":\"Teslimin kabulü, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Teslimin kabulü\"},\"11\":{\"paragraphs\":{\"1\":\"Eksik/ayıplı ifa bildirimi, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Eksik/ayıplı ifa bildirimi\"},\"12\":{\"paragraphs\":{\"1\":\"Mücbir sebepler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Mücbir sebepler\"}},\"shortTitle\":\"Hizmet Teslim Koşulları\",\"title\":\"Hizmet Teslim ve İfa Koşulları\"},\"iptal-cayma-iade-kosullari\":{\"description\":\"Hizmetin aşamasına göre iptal, cayma ve iade süreçlerinin genel çerçevesi.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Ödeme tamamlanmadan önce teklif kabul edilmemişse müşteri işlemi durdurabilir.\"},\"title\":\"Ödeme öncesi iptal\"},\"2\":{\"paragraphs\":{\"1\":\"Fiilen başlanmayan hizmette iade; belgelenebilir işlem maliyetleri, sözleşme ve emredici hükümler dikkate alınarak değerlendirilir.\"},\"title\":\"Kapora sonrası fakat hizmet başlamadan iptal\"},\"3\":{\"paragraphs\":{\"1\":\"Tamamlanan iş, ayrılan kaynak ve hakedişler şeffaf biçimde hesaplanır; kalan tutarın iadesi somut dosyaya göre belirlenir.\"},\"title\":\"Hizmete başlandıktan sonra iptal\"},\"4\":{\"paragraphs\":{\"1\":\"Tamamlanmış aşamalar, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Tamamlanmış aşamalar\"},\"5\":{\"paragraphs\":{\"1\":\"Müşteriye özel hazırlanmış çalışmalar, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Müşteriye özel hazırlanmış çalışmalar\"},\"6\":{\"paragraphs\":{\"1\":\"Hakediş bazlı ödeme, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Hakediş bazlı ödeme\"},\"7\":{\"paragraphs\":{\"1\":\"Doğrulanan yanlış ya da mükerrer ödeme için müşteri gecikmeden bilgilendirilir ve iade süreci başlatılır.\"},\"title\":\"Yanlış veya mükerrer ödeme\"},\"8\":{\"paragraphs\":{\"1\":\"Kartla alınan tutar, teknik ve hukuki olarak mümkün olduğu ölçüde aynı ödeme aracına iade edilir. Nakit veya farklı hesaba yönlendirme talepleri güvenlik kontrolüne tabidir.\"},\"title\":\"İade yöntemi\"},\"9\":{\"paragraphs\":{\"1\":\"Kesin süre, ödeme sağlayıcısı ve banka işlem süreleri doğrulandıktan sonra işlem bazında bildirilir.\"},\"title\":\"İade süresi\"},\"10\":{\"paragraphs\":{\"1\":\"Kart iadelerinin ödeme aracına yapılması, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Kart iadelerinin ödeme aracına yapılması\"},\"11\":{\"paragraphs\":{\"1\":\"Talep kanalı, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Talep kanalı\"},\"12\":{\"paragraphs\":{\"1\":\"Gerekli bilgi ve belgeler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Gerekli bilgi ve belgeler\"}},\"shortTitle\":\"İptal ve İade\",\"title\":\"İptal, Cayma ve İade Koşulları\"},\"kvkk-aydinlatma-metni\":{\"description\":\"Kişisel verilerin faaliyet bazlı işlenmesi hakkında aydınlatma metni.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Veri sorumlusunun doğrulanmış ticari bilgileri şirket kartında yayımlanır.\"},\"title\":\"Veri sorumlusu\"},\"2\":{\"paragraphs\":{\"1\":\"Kimlik, iletişim, müşteri işlem, finans, proje/taşınmaz, işlem güvenliği, hukuki işlem ve talep/şikâyet verileri; yalnız ilgili faaliyet gerektirdiği ölçüde işlenebilir.\"},\"title\":\"İşlenen kişisel veri kategorileri\"},\"3\":{\"paragraphs\":{\"1\":\"Veriler web formları, e-posta, telefon, toplantı, sözleşme/teklif, Client Portal ve teknik günlükler üzerinden otomatik veya otomatik olmayan yollarla toplanabilir.\"},\"title\":\"Toplama yöntemleri\"},\"4\":{\"paragraphs\":{\"1\":\"Teklif ve sözleşme süreçleri; sözleşmenin kurulması/ifası. Faturalama ve resmî yükümlülükler; hukuki yükümlülük. Güvenlik ve uyuşmazlık yönetimi; meşru menfaat veya hakkın tesisi. İzne bağlı iletişim/analitik; gerekli olduğu durumda açık rıza.\"},\"title\":\"İşleme amaçları ve hukuki sebepler\"},\"5\":{\"paragraphs\":{\"1\":\"Yetkili kamu kurumları, mali/hukuki danışmanlar, barındırma, veri altyapısı, e-posta ve analitik hizmet sağlayıcıları ile; amaçla sınırlı ve gerekli güvenceyle paylaşım yapılabilir.\"},\"title\":\"Aktarım yapılan taraf kategorileri\"},\"6\":{\"paragraphs\":{\"1\":\"Altyapı sağlayıcılarının veri konumu ve aktarım mekanizmaları aşağıdaki sağlayıcı listesine göre sözleşme öncesi doğrulanmalıdır. Kesin bir ‘aktarım yoktur’ beyanı verilmemektedir.\"},\"title\":\"Yurt dışı aktarım\"},\"7\":{\"paragraphs\":{\"1\":\"Süreler; sözleşme ilişkisi, yasal yükümlülük, zamanaşımı, uyuşmazlık ve işleme amacının sona ermesi kriterlerine göre veri kategorisi bazında belirlenir.\"},\"title\":\"Saklama süreleri veya belirleme kriterleri\"},\"8\":{\"paragraphs\":{\"1\":\"Erişim yetkilendirmesi, parola ve oturum kontrolleri, TLS, kayıt/log incelemesi, yedekleme, tedarikçi değerlendirmesi ve personel farkındalığı gibi ölçülü tedbirler uygulanır.\"},\"title\":\"Teknik/idari tedbirler\"},\"9\":{\"paragraphs\":{\"1\":\"İlgili kişiler; verilerinin işlenip işlenmediğini öğrenme, bilgi talep etme, düzeltme/silme isteme, aktarılan taraflara bildirim, sonuca itiraz ve zarar halinde giderim talebi haklarını mevzuattaki şartlarla kullanabilir.\"},\"title\":\"KVKK madde 11 kapsamındaki haklar\"},\"10\":{\"paragraphs\":{\"1\":\"Başvurular kimlik doğrulamaya elverişli bilgi ve talep açıklamasıyla KVKK iletişim kanalına iletilir. Usul ve yanıt süreleri yayımdan önce hukuk danışmanıyla doğrulanmalıdır.\"},\"title\":\"Başvuru yöntemi\"},\"11\":{\"paragraphs\":{\"1\":\"Güncel başvuru kanalları aşağıdaki şirket kartında yer alır.\"},\"title\":\"İletişim bilgileri\"}},\"shortTitle\":\"KVKK\",\"title\":\"KVKK Aydınlatma Metni\"},\"mesafeli-hizmet-sozlesmesi\":{\"description\":\"Mimarlık ve danışmanlık hizmetlerine özgü genel mesafeli sözleşme çerçevesi.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Taraflar, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Taraflar\"},\"2\":{\"paragraphs\":{\"1\":\"Tanımlar, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Tanımlar\"},\"3\":{\"paragraphs\":{\"1\":\"Sözleşmenin konusu, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Sözleşmenin konusu\"},\"4\":{\"paragraphs\":{\"1\":\"Hizmet kapsamı, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Hizmet kapsamı\"},\"5\":{\"paragraphs\":{\"1\":\"Teklif ve proje özel şartlarının önceliği, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Teklif ve proje özel şartlarının önceliği\"},\"6\":{\"paragraphs\":{\"1\":\"Bedel, KDV ve indirim, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Bedel, KDV ve indirim\"},\"7\":{\"paragraphs\":{\"1\":\"Kapora ve hakedişler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Kapora ve hakedişler\"},\"8\":{\"paragraphs\":{\"1\":\"Ödeme yöntemi, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Ödeme yöntemi\"},\"9\":{\"paragraphs\":{\"1\":\"Hizmetin başlama şartları, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Hizmetin başlama şartları\"},\"10\":{\"paragraphs\":{\"1\":\"Müşterinin bilgi/belge sağlama yükümlülüğü, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Müşterinin bilgi/belge sağlama yükümlülüğü\"},\"11\":{\"paragraphs\":{\"1\":\"Revizyon kapsamı, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Revizyon kapsamı\"},\"12\":{\"paragraphs\":{\"1\":\"Teslim ve ifa, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Teslim ve ifa\"},\"13\":{\"paragraphs\":{\"1\":\"Cayma hakkının kapsamı ve kullanımı müşteri sıfatı, sözleşme türü ve yürürlükteki mevzuata göre belirlenir.\"},\"title\":\"Cayma hakkı\"},\"14\":{\"paragraphs\":{\"1\":\"Cayma süresi içinde hizmete başlanması, yalnız müşterinin mevzuata uygun açık talebi/onayı alınarak ve sonuçları bildirilerek değerlendirilir.\"},\"title\":\"Hizmet ifasına başlanması halinde uygulanacak hükümler\"},\"15\":{\"paragraphs\":{\"1\":\"İptal ve iade, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"İptal ve iade\"},\"16\":{\"paragraphs\":{\"1\":\"Fikri mülkiyet ve kullanım hakları, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Fikri mülkiyet ve kullanım hakları\"},\"17\":{\"paragraphs\":{\"1\":\"Gizlilik ve kişisel veriler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Gizlilik ve kişisel veriler\"},\"18\":{\"paragraphs\":{\"1\":\"Mücbir sebep, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Mücbir sebep\"},\"19\":{\"paragraphs\":{\"1\":\"Bildirimler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Bildirimler\"},\"20\":{\"paragraphs\":{\"1\":\"Uyuşmazlık, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Uyuşmazlık\"},\"21\":{\"paragraphs\":{\"1\":\"Yürürlük, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Yürürlük\"}},\"shortTitle\":\"Mesafeli Hizmet Sözleşmesi\",\"title\":\"Mesafeli Hizmet Sözleşmesi\"},\"odeme-ve-guvenlik\":{\"description\":\"Planlanan online tahsilat modeli ve ödeme güvenliği ilkeleri.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Online tahsilat özelliği devreye alındığında ödemeler, seçilecek lisanslı ödeme kuruluşunun güvenli altyapısı üzerinden alınacaktır. Henüz aktif bir sağlayıcı ilan edilmemektedir.\"},\"title\":\"Ödeme altyapısı\"},\"2\":{\"paragraphs\":{\"1\":\"ARZ Mimarlık kart numarası veya CVV saklamayacaktır; kart verileri ödeme kuruluşunun güvenli ödeme ekranında işlenecektir.\"},\"title\":\"Kart verileri\"},\"3\":{\"paragraphs\":{\"1\":\"Site ile bağlantı aktarım sırasında SSL/TLS ile korunur.\"},\"title\":\"SSL/TLS\"},\"4\":{\"paragraphs\":{\"1\":\"Seçilen sağlayıcı ve işlem desteklediğinde 3D Secure doğrulaması kullanılacaktır.\"},\"title\":\"3D Secure\"},\"5\":{\"paragraphs\":{\"1\":\"Teklif, kapora, hakediş ve tek kullanımlık ödeme bağlantısı modeli planlanmaktadır; bu sayfa ödeme işlevinin aktif olduğu anlamına gelmez.\"},\"title\":\"Tahsilat modeli\"},\"6\":{\"paragraphs\":{\"1\":\"KDV dahil/hariç fiyat sunumu, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"KDV dahil/hariç fiyat sunumu\"},\"7\":{\"paragraphs\":{\"1\":\"İndirim sunumu, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"İndirim sunumu\"},\"8\":{\"paragraphs\":{\"1\":\"Para birimi, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Para birimi\"},\"9\":{\"paragraphs\":{\"1\":\"Mükerrer ödeme, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Mükerrer ödeme\"},\"10\":{\"paragraphs\":{\"1\":\"Şüpheli işlem kontrolü, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Şüpheli işlem kontrolü\"},\"11\":{\"paragraphs\":{\"1\":\"İade işlemi, onaylanan teklif ve proje özel şartlarıyla .\"},\"title\":\"Client Portal üzerinden teslim\"},\"5\":{\"paragraphs\":{\"1\":\"Dosya boyutu ve gizlilik düzeyine göre e-posta ya da süreli/güvenli indirme bağlantısı kullanılabilir.\"},\"title\":\"E-posta veya güvenli indirme\"},\"6\":{\"paragraphs\":{\"1\":\"Tahmini süreler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Tahmini süreler\"},\"7\":{\"paragraphs\":{\"1\":\"Müşteriden kaynaklanan gecikmeler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Müşteriden kaynaklanan gecikmeler\"},\"8\":{\"paragraphs\":{\"1\":\"Resmî kurum/belediye süreçlerinden kaynaklanan süreler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Resmî kurum/belediye süreçlerinden kaynaklanan süreler\"},\"9\":{\"paragraphs\":{\"1\":\"Revizyon süreleri, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Revizyon süreleri\"},\"10\":{\"paragraphs\":{\"1\":\"Teslimin kabulü, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Teslimin kabulü\"},\"11\":{\"paragraphs\":{\"1\":\"Eksik/ayıplı ifa bildirimi, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Eksik/ayıplı ifa bildirimi\"},\"12\":{\"paragraphs\":{\"1\":\"Mücbir sebepler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Mücbir sebepler\"}},\"shortTitle\":\"Hizmet Teslim Koşulları\",\"title\":\"Hizmet Teslim ve İfa Koşulları\"},\"iptal-cayma-iade-kosullari\":{\"description\":\"Hizmetin aşamasına göre iptal, cayma ve iade süreçlerinin genel çerçevesi.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Ödeme tamamlanmadan önce teklif kabul edilmemişse müşteri işlemi durdurabilir.\"},\"title\":\"Ödeme öncesi iptal\"},\"2\":{\"paragraphs\":{\"1\":\"Fiilen başlanmayan hizmette iade; belgelenebilir işlem maliyetleri, sözleşme ve emredici hükümler dikkate alınarak değerlendirilir.\"},\"title\":\"Kapora sonrası fakat hizmet başlamadan iptal\"},\"3\":{\"paragraphs\":{\"1\":\"Tamamlanan iş, ayrılan kaynak ve hakedişler şeffaf biçimde hesaplanır; kalan tutarın iadesi somut dosyaya göre belirlenir.\"},\"title\":\"Hizmete başlandıktan sonra iptal\"},\"4\":{\"paragraphs\":{\"1\":\"Tamamlanmış aşamalar, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Tamamlanmış aşamalar\"},\"5\":{\"paragraphs\":{\"1\":\"Müşteriye özel hazırlanmış çalışmalar, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Müşteriye özel hazırlanmış çalışmalar\"},\"6\":{\"paragraphs\":{\"1\":\"Hakediş bazlı ödeme, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Hakediş bazlı ödeme\"},\"7\":{\"paragraphs\":{\"1\":\"Doğrulanan yanlış ya da mükerrer ödeme için müşteri gecikmeden bilgilendirilir ve iade süreci başlatılır.\"},\"title\":\"Yanlış veya mükerrer ödeme\"},\"8\":{\"paragraphs\":{\"1\":\"Kartla alınan tutar, teknik ve hukuki olarak mümkün olduğu ölçüde aynı ödeme aracına iade edilir. Nakit veya farklı hesaba yönlendirme talepleri güvenlik kontrolüne tabidir.\"},\"title\":\"İade yöntemi\"},\"9\":{\"paragraphs\":{\"1\":\"Kesin süre, ödeme sağlayıcısı ve banka işlem süreleri doğrulandıktan sonra işlem bazında bildirilir.\"},\"title\":\"İade süresi\"},\"10\":{\"paragraphs\":{\"1\":\"Kart iadelerinin ödeme aracına yapılması, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Kart iadelerinin ödeme aracına yapılması\"},\"11\":{\"paragraphs\":{\"1\":\"Talep kanalı, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Talep kanalı\"},\"12\":{\"paragraphs\":{\"1\":\"Gerekli bilgi ve belgeler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Gerekli bilgi ve belgeler\"}},\"shortTitle\":\"İptal ve İade\",\"title\":\"İptal, Cayma ve İade Koşulları\"},\"kvkk-aydinlatma-metni\":{\"description\":\"Kişisel verilerin faaliyet bazlı işlenmesi hakkında aydınlatma metni.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Veri sorumlusunun doğrulanmış ticari bilgileri şirket kartında yayımlanır.\"},\"title\":\"Veri sorumlusu\"},\"2\":{\"paragraphs\":{\"1\":\"Kimlik, iletişim, müşteri işlem, finans, proje/taşınmaz, işlem güvenliği, hukuki işlem ve talep/şikâyet verileri; yalnız ilgili faaliyet gerektirdiği ölçüde işlenebilir.\"},\"title\":\"İşlenen kişisel veri kategorileri\"},\"3\":{\"paragraphs\":{\"1\":\"Veriler web formları, e-posta, telefon, toplantı, sözleşme/teklif, Client Portal ve teknik günlükler üzerinden otomatik veya otomatik olmayan yollarla toplanabilir.\"},\"title\":\"Toplama yöntemleri\"},\"4\":{\"paragraphs\":{\"1\":\"Teklif ve sözleşme süreçleri; sözleşmenin kurulması/ifası. Faturalama ve resmî yükümlülükler; hukuki yükümlülük. Güvenlik ve uyuşmazlık yönetimi; meşru menfaat veya hakkın tesisi. İzne bağlı iletişim/analitik; gerekli olduğu durumda açık rıza.\"},\"title\":\"İşleme amaçları ve hukuki sebepler\"},\"5\":{\"paragraphs\":{\"1\":\"Yetkili kamu kurumları, mali/hukuki danışmanlar, barındırma, veri altyapısı, e-posta ve analitik hizmet sağlayıcıları ile; amaçla sınırlı ve gerekli güvenceyle paylaşım yapılabilir.\"},\"title\":\"Aktarım yapılan taraf kategorileri\"},\"6\":{\"paragraphs\":{\"1\":\"Altyapı sağlayıcılarının veri konumu ve aktarım mekanizmaları aşağıdaki sağlayıcı listesine göre sözleşme öncesi doğrulanmalıdır. Kesin bir ‘aktarım yoktur’ beyanı verilmemektedir.\"},\"title\":\"Yurt dışı aktarım\"},\"7\":{\"paragraphs\":{\"1\":\"Süreler; sözleşme ilişkisi, yasal yükümlülük, zamanaşımı, uyuşmazlık ve işleme amacının sona ermesi kriterlerine göre veri kategorisi bazında belirlenir.\"},\"title\":\"Saklama süreleri veya belirleme kriterleri\"},\"8\":{\"paragraphs\":{\"1\":\"Erişim yetkilendirmesi, parola ve oturum kontrolleri, TLS, kayıt/log incelemesi, yedekleme, tedarikçi değerlendirmesi ve personel farkındalığı gibi ölçülü tedbirler uygulanır.\"},\"title\":\"Teknik/idari tedbirler\"},\"9\":{\"paragraphs\":{\"1\":\"İlgili kişiler; verilerinin işlenip işlenmediğini öğrenme, bilgi talep etme, düzeltme/silme isteme, aktarılan taraflara bildirim, sonuca itiraz ve zarar halinde giderim talebi haklarını mevzuattaki şartlarla kullanabilir.\"},\"title\":\"KVKK madde 11 kapsamındaki haklar\"},\"10\":{\"paragraphs\":{\"1\":\"Başvurular kimlik doğrulamaya elverişli bilgi ve talep açıklamasıyla KVKK iletişim kanalına iletilir. Usul ve yanıt süreleri yayımdan önce hukuk danışmanıyla doğrulanmalıdır.\"},\"title\":\"Başvuru yöntemi\"},\"11\":{\"paragraphs\":{\"1\":\"Güncel başvuru kanalları aşağıdaki şirket kartında yer alır.\"},\"title\":\"İletişim bilgileri\"}},\"shortTitle\":\"KVKK\",\"title\":\"KVKK Aydınlatma Metni\"},\"mesafeli-hizmet-sozlesmesi\":{\"description\":\"Mimarlık ve danışmanlık hizmetlerine özgü genel mesafeli sözleşme çerçevesi.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Taraflar, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Taraflar\"},\"2\":{\"paragraphs\":{\"1\":\"Tanımlar, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Tanımlar\"},\"3\":{\"paragraphs\":{\"1\":\"Sözleşmenin konusu, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Sözleşmenin konusu\"},\"4\":{\"paragraphs\":{\"1\":\"Hizmet kapsamı, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Hizmet kapsamı\"},\"5\":{\"paragraphs\":{\"1\":\"Teklif ve proje özel şartlarının önceliği, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Teklif ve proje özel şartlarının önceliği\"},\"6\":{\"paragraphs\":{\"1\":\"Bedel, KDV ve indirim, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Bedel, KDV ve indirim\"},\"7\":{\"paragraphs\":{\"1\":\"Kapora ve hakedişler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Kapora ve hakedişler\"},\"8\":{\"paragraphs\":{\"1\":\"Ödeme yöntemi, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Ödeme yöntemi\"},\"9\":{\"paragraphs\":{\"1\":\"Hizmetin başlama şartları, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Hizmetin başlama şartları\"},\"10\":{\"paragraphs\":{\"1\":\"Müşterinin bilgi/belge sağlama yükümlülüğü, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Müşterinin bilgi/belge sağlama yükümlülüğü\"},\"11\":{\"paragraphs\":{\"1\":\"Revizyon kapsamı, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Revizyon kapsamı\"},\"12\":{\"paragraphs\":{\"1\":\"Teslim ve ifa, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Teslim ve ifa\"},\"13\":{\"paragraphs\":{\"1\":\"Cayma hakkının kapsamı ve kullanımı müşteri sıfatı, sözleşme türü ve yürürlükteki mevzuata göre belirlenir.\"},\"title\":\"Cayma hakkı\"},\"14\":{\"paragraphs\":{\"1\":\"Cayma süresi içinde hizmete başlanması, yalnız müşterinin mevzuata uygun açık talebi/onayı alınarak ve sonuçları bildirilerek değerlendirilir.\"},\"title\":\"Hizmet ifasına başlanması halinde uygulanacak hükümler\"},\"15\":{\"paragraphs\":{\"1\":\"İptal ve iade, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"İptal ve iade\"},\"16\":{\"paragraphs\":{\"1\":\"Fikri mülkiyet ve kullanım hakları, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Fikri mülkiyet ve kullanım hakları\"},\"17\":{\"paragraphs\":{\"1\":\"Gizlilik ve kişisel veriler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Gizlilik ve kişisel veriler\"},\"18\":{\"paragraphs\":{\"1\":\"Mücbir sebep, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Mücbir sebep\"},\"19\":{\"paragraphs\":{\"1\":\"Bildirimler, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Bildirimler\"},\"20\":{\"paragraphs\":{\"1\":\"Uyuşmazlık, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Uyuşmazlık\"},\"21\":{\"paragraphs\":{\"1\":\"Yürürlük, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Yürürlük\"}},\"shortTitle\":\"Mesafeli Hizmet Sözleşmesi\",\"title\":\"Mesafeli Hizmet Sözleşmesi\"},\"odeme-ve-guvenlik\":{\"description\":\"Planlanan online tahsilat modeli ve ödeme güvenliği ilkeleri.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Online tahsilat özelliği devreye alındığında ödemeler, seçilecek lisanslı ödeme kuruluşunun güvenli altyapısı üzerinden alınacaktır. Henüz aktif bir sağlayıcı ilan edilmemektedir.\"},\"title\":\"Ödeme altyapısı\"},\"2\":{\"paragraphs\":{\"1\":\"ARZ Mimarlık kart numarası veya CVV saklamayacaktır; kart verileri ödeme kuruluşunun güvenli ödeme ekranında işlenecektir.\"},\"title\":\"Kart verileri\"},\"3\":{\"paragraphs\":{\"1\":\"Site ile bağlantı aktarım sırasında SSL/TLS ile korunur.\"},\"title\":\"SSL/TLS\"},\"4\":{\"paragraphs\":{\"1\":\"Seçilen sağlayıcı ve işlem desteklediğinde 3D Secure doğrulaması kullanılacaktır.\"},\"title\":\"3D Secure\"},\"5\":{\"paragraphs\":{\"1\":\"Teklif, kapora, hakediş ve tek kullanımlık ödeme bağlantısı modeli planlanmaktadır; bu sayfa ödeme işlevinin aktif olduğu anlamına gelmez.\"},\"title\":\"Tahsilat modeli\"},\"6\":{\"paragraphs\":{\"1\":\"KDV dahil/hariç fiyat sunumu, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"KDV dahil/hariç fiyat sunumu\"},\"7\":{\"paragraphs\":{\"1\":\"İndirim sunumu, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"İndirim sunumu\"},\"8\":{\"paragraphs\":{\"1\":\"Para birimi, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Para birimi\"},\"9\":{\"paragraphs\":{\"1\":\"Mükerrer ödeme, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Mükerrer ödeme\"},\"10\":{\"paragraphs\":{\"1\":\"Şüpheli işlem kontrolü, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"Şüpheli işlem kontrolü\"},\"11\":{\"paragraphs\":{\"1\":\"İade işlemi, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"İade işlemi\"},\"12\":{\"paragraphs\":{\"1\":\"İletişim, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\"},\"title\":\"İletişim\"}},\"shortTitle\":\"Ödeme ve Güvenlik\",\"title\":\"Ödeme ve Güvenlik\"},\"on-bilgilendirme-formu\":{\"description\":\"Mimarlık ve danışmanlık hizmetleri için işlem öncesi genel bilgilendirme şablonu.\",\"sections\":{\"1\":{\"paragraphs\":{\"1\":\"Sağlayıcının güncel ticari ve iletişim bilgileri aşağıdaki şirket kartında yer alır.\"},\"title\":\"Sağlayıcının kimliği ve iletişim bilgileri\"},\"2\":{\"paragraphs\":{\"1\":\"Hizmetin temel nitelikleri, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\",\"2\":\"Bu genel şablonda işleme özgü değer bulunmaz; ileride ödeme öncesi teklif özeti/snapshot ile ayrıca gösterilecektir.\"},\"title\":\"Hizmetin temel nitelikleri\"},\"3\":{\"paragraphs\":{\"1\":\"Hizmet bedeli, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\",\"2\":\"Bu genel şablonda işleme özgü değer bulunmaz; ileride ödeme öncesi teklif özeti/snapshot ile ayrıca gösterilecektir.\"},\"title\":\"Hizmet bedeli\"},\"4\":{\"paragraphs\":{\"1\":\"İndirim, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\",\"2\":\"Bu genel şablonda işleme özgü değer bulunmaz; ileride ödeme öncesi teklif özeti/snapshot ile ayrıca gösterilecektir.\"},\"title\":\"İndirim\"},\"5\":{\"paragraphs\":{\"1\":\"KDV dahil/hariç durumu, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\",\"2\":\"Bu genel şablonda işleme özgü değer bulunmaz; ileride ödeme öncesi teklif özeti/snapshot ile ayrıca gösterilecektir.\"},\"title\":\"KDV dahil/hariç durumu\"},\"6\":{\"paragraphs\":{\"1\":\"KDV oranı ve tutarı, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\",\"2\":\"Bu genel şablonda işleme özgü değer bulunmaz; ileride ödeme öncesi teklif özeti/snapshot ile ayrıca gösterilecektir.\"},\"title\":\"KDV oranı ve tutarı\"},\"7\":{\"paragraphs\":{\"1\":\"Genel toplam, onaylanan teklif ve proje özel şartlarıyla birlikte değerlendirilir. Somut işlem öncesinde kapsam, tutar ve tarihler müşteriye açıkça sunulur.\",\"2\":\"Bu genel şablonda işleme özgü değer bulunmaz; ileride ödeme öncesi teklif özeti/snapshot ile ayrıca gösterilecektir.\"},\"title\":\"Genel toplam\"},\"8\":{\"paragraphs\":{\"1\":\"Ödeme yöntemi, onaylanan teklif ve proje özel şartlar
